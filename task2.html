<!DOCTYPE html>
<html>
    <head>
        <title>doctor appointment booking interface </title>
        <style>
     body{font-family:Arial; background:#eee}
.box{width:700px; margin:20px auto; background:#fff; padding:20px}
h1{text-align:center}
.doc{border:1px solid #000; padding:10px; margin:10px 0}
button{background:#000; color:#fff; padding:10px; border:0}
input,select{width:100%; padding:10px; margin:5px 0}
</style>
</head>
<body>

<div class="box">
<h1>BOOK APPOINTMENT</h1>

<div class="doc">
<b>Dr. Anil</b> - General - 10AM-1PM<br>
<button>10:00</button> <button>10:30</button>
</div>

<div class="doc">
<b>Dr. Priya</b> - Skin - 4PM-7PM<br>
<button>4:00</button> <button>4:30</button>
</div>

<h2>FORM</h2>
<form>
Name<input type="text">
Mobile<input type="tel">
Doctor<select><option>Dr.Anil</option><option>Dr.Priya</option></select>
Date<input type="date">
<button>SUBMIT</button>
</form>
</div>

</body>
</html>
